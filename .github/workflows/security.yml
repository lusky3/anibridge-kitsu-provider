name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday at 04:00 UTC

permissions:
  contents: read

jobs:
  trufflehog:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@v3.90.0
        with:
          extra_args: --only-verified

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.9"

      - name: Export locked dependencies
        run: uv export --frozen --no-hashes --no-emit-project -o requirements-audit.txt

      # Audit only the project's locked dependencies (not the runner's system Python).
      # diskcache has no fixed release yet (PYSEC-2026-2447); remove the ignore once one ships.
      - name: Run pip-audit
        run: uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip --ignore-vuln PYSEC-2026-2447
