name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify Version and Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify Version & CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail

          # Extract version from tag (e.g. refs/tags/v0.1.0 -> 0.1.0)
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"
          echo "Release tag: ${TAG_NAME}"
          echo "Target version: ${TAG_VERSION}"

          # 1. Verify pyproject.toml exists and version matches tag
          if [ ! -f "pyproject.toml" ]; then
            echo "::error::pyproject.toml not found!"
            exit 1
          fi

          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "pyproject.toml version: ${PYPROJECT_VERSION}"

          if [ "${PYPROJECT_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Version mismatch! pyproject.toml declares version '${PYPROJECT_VERSION}', but tag is '${TAG_NAME}' (${TAG_VERSION})."
            exit 1
          fi

          # 2. Verify CHANGELOG.md exists
          if [ ! -f "CHANGELOG.md" ]; then
            echo "::error::CHANGELOG.md not found! All releases must update CHANGELOG.md before publishing."
            exit 1
          fi

          # 3. Verify CHANGELOG.md contains an entry for this version
          if ! grep -qE "^## \[?${TAG_VERSION}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no release section for version '${TAG_VERSION}'!"
            echo "Please add a '## [${TAG_VERSION}] - YYYY-MM-DD' section to CHANGELOG.md."
            exit 1
          fi

          echo "✅ Release verification passed: pyproject.toml and CHANGELOG.md are up to date for v${TAG_VERSION}."

  publish:
    name: Build and publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
